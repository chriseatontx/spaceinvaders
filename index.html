<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPACE INVADERS // SERVICE CABINET</title>
<link rel="stylesheet" href="css/cabinet.css">
</head>
<body>
<main class="cabinet-shell" aria-label="Space Invaders arcade cabinet">
  <header class="marquee">SPACE INVADERS<small>ARCADE SYSTEM // 198X</small></header>
  <section class="cabinet-body">
    <div class="screen-bezel"><canvas id="game" width="800" height="600" aria-label="Space Invaders game screen"></canvas></div>
    <aside class="service-panel" aria-label="Cabinet service panel">
      <div class="panel-label">COIN MECH // ONLINE</div>
      <div class="credit-readout" id="cabinet-plays">CREDIT 00<span>QUARTERS READY</span></div>
      <button class="cabinet-button" id="add-quarter" type="button">ADD QUARTER</button>
      <div class="coin-slot" aria-hidden="true"></div>
      <div class="service-divider"></div>
      <div class="score-credit"><small>SCORE CREDITS</small><span id="score-credits">000000</span></div>
      <section class="upgrade-card" id="fire-control-card" hidden aria-live="polite">
        <h2>FIRE CONTROL</h2>
        <p>Cycle timing stabilized. Fire 20% faster.</p>
        <button id="buy-fire-control" type="button">INSTALL</button>
      </section>
      <button class="cabinet-button" id="debug-toggle" type="button">DEBUG: OFF</button>
      <section class="debug-panel" id="debug-panel" hidden aria-live="polite">
        <h2>SERVICE DEBUG</h2>
        <button id="debug-gun" type="button">GUN: AUTO</button>
        <button id="debug-speed" type="button">SPEED: 1X</button>
        <button id="debug-inv" type="button">INVINCIBLE: OFF</button>
        <div class="debug-readout" id="debug-readout">DEBUG ON</div>
      </section>
      <div class="status-line" id="cabinet-status"><span class="status-light"></span>INSERT A QUARTER TO START</div>
    </aside>
  </section>
  <footer class="footer-strip"><span>MOVE: ARROWS / A-D / TOUCH</span><span>FIRE: AUTOMATIC</span><span>M: SOUND</span></footer>
</main>
<script>
"use strict";

var canvas = document.getElementById("game");
var W = canvas.width;
var H = canvas.height;
var cabinetPlaysNode = document.getElementById("cabinet-plays");
var scoreCreditsNode = document.getElementById("score-credits");
var cabinetStatusNode = document.getElementById("cabinet-status");
var addQuarterButton = document.getElementById("add-quarter");
var fireControlCard = document.getElementById("fire-control-card");
var buyFireControlButton = document.getElementById("buy-fire-control");
var debugToggleButton = document.getElementById("debug-toggle");
var debugPanel = document.getElementById("debug-panel");
var debugGunButton = document.getElementById("debug-gun");
var debugSpeedButton = document.getElementById("debug-speed");
var debugInvButton = document.getElementById("debug-inv");
var debugReadoutNode = document.getElementById("debug-readout");

var VERSION = "1.6.2";

var CABINET_CONFIG = {
  quarterCost: 1,
  scoreCreditRate: 1,
  scoreCreditLabel: "SCORE CREDITS",
  fireControl: { id: "fire_control_1", cost: 120, cooldownMultiplier: 0.8 },
  storage: { plays: "si-cabinet-plays", scoreCredits: "si-score-credits", fireControl: "si-fire-control-1" }
};

var DEBUG_CONFIG = { speedMultiplier: 2 };

var COLS = 11;
var ROWS = 5;
var CELL_W = 32;
var CELL_H = 24;
var INV_W = 24;
var INV_H = 16;
var MARGIN = 16;
var DROP = 12;
var SHIELD_CELL = 8;
var GAME_OVER_FLOOR_MARGIN = 20;
var SHIP_EXPLOSION_PARTICLES = 18;
var SHIP_EXPLOSION_LIFE = 1.1;
var SHIP_EXPLOSION_SPEED = 150;
var ROW_POINTS = [30, 20, 20, 10, 10];
var ROW_COLORS = ["#ff4fd8", "#7f7fff", "#4fd8ff", "#4fff4f", "#d8ff4f"];
var SHIELD_COLOR = "#3fae5f";
var UFO_W = 24;
var UFO_H = 12;
var UFO_Y = 36;
var UFO_SPEED = 90;
var UFO_POINTS = [100, 200, 300];

var audioCtx = null;
var muted = false;
var ufoSound = null;

function initAudio() {
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (Ctor) audioCtx = new Ctor();
  } catch (e) {
    audioCtx = null;
  }
}

function wakeAudio() {
  if (audioCtx && audioCtx.state === "suspended") {
    try { audioCtx.resume(); } catch (e) {}
  }
}

function toggleMute() {
  muted = !muted;
  if (muted) stopUfoSound();
}

function stopUfoSound() {
  if (!ufoSound) return;
  try {
    if (ufoSound.osc) ufoSound.osc.stop();
  } catch (e) {}
  ufoSound = null;
}

function playNote(freq, delay, dur, type, vol, freqEnd) {
  if (!audioCtx || muted) return;
  try {
    var start = audioCtx.currentTime + delay;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (freqEnd !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), start + dur);
    }
    gain.gain.setValueAtTime(vol, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur);
  } catch (e) {}
}

function playFire() {
  playNote(900, 0, 0.08, "square", 0.08, 300);
}

function playQuarter() {
  if (!audioCtx || muted) return;
  playNote(950, 0, 0.05, "square", 0.1, 1200);
  playNote(1600, 0.06, 0.06, "square", 0.07, 1700);
}

function playServiceInstall() {
  if (!audioCtx || muted) return;
  playNote(330, 0, 0.08, "square", 0.08, null);
  playNote(660, 0.09, 0.08, "square", 0.08, null);
  playNote(990, 0.18, 0.14, "square", 0.08, null);
}

function playExplosion() {
  playNote(180, 0, 0.18, "sawtooth", 0.12, 40);
}

function playDeath() {
  playNote(320, 0, 0.35, "triangle", 0.12, 80);
}

function playPlayerExplosion() {
  playNote(200, 0, 0.3, "sawtooth", 0.16, 30);
  playNote(120, 0.12, 0.35, "sawtooth", 0.14, 25);
}

function playUfoSpawn() {
  playNote(160, 0, 0.25, "sine", 0.08, 520);
}

function playUfoHit() {
  playNote(520, 0, 0.22, "sawtooth", 0.14, 120);
}

function playWaveJingle() {
  if (!audioCtx || muted) return;
  try {
    playNote(523, 0, 0.12, "square", 0.08, null);
    playNote(659, 0.12, 0.12, "square", 0.08, null);
    playNote(784, 0.24, 0.16, "square", 0.08, null);
  } catch (e) {}
}

function playGameOver() {
  if (!audioCtx || muted) return;
  try {
    playNote(300, 0, 0.25, "triangle", 0.12, 120);
    playNote(220, 0.25, 0.25, "triangle", 0.12, 90);
    playNote(150, 0.5, 0.35, "triangle", 0.12, 60);
  } catch (e) {}
}

function startUfoSound() {
  if (!audioCtx || muted || ufoSound) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 220;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    ufoSound = { osc: osc, gain: gain, started: audioCtx.currentTime };
  } catch (e) {
    ufoSound = null;
  }
}

function updateUfoSound(u) {
  if (!ufoSound) {
    startUfoSound();
    return;
  }
  try {
    var t = audioCtx.currentTime - ufoSound.started;
    var freq = 180 + 120 * Math.sin(t * 18) + (u.x / W) * 80;
    ufoSound.osc.frequency.setValueAtTime(Math.max(50, freq), audioCtx.currentTime);
    ufoSound.gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  } catch (e) {}
}


function loadHiScore() {
  try {
    var v = Number(localStorage.getItem("si-hiscore"));
    return Number.isInteger(v) && v >= 0 ? v : 0;
  } catch (e) {
    return 0;
  }
}

function saveHiScore(v) {
  try {
    localStorage.setItem("si-hiscore", String(v));
  } catch (e) {}
}

function loadInteger(key) {
  try {
    var value = Number(localStorage.getItem(key));
    return Number.isInteger(value) && value >= 0 ? value : 0;
  } catch (e) {
    return 0;
  }
}

function saveInteger(key, value) {
  try { localStorage.setItem(key, String(value)); } catch (e) {}
}

function loadBoolean(key) {
  try { return localStorage.getItem(key) === "1"; } catch (e) { return false; }
}

function saveBoolean(key, value) {
  try { localStorage.setItem(key, value ? "1" : "0"); } catch (e) {}
}

function Game(cv) {
  this.ctx = cv.getContext("2d");
  this.state = "title";
  this.input = { left: false, right: false, enter: false };
  this.hiScore = loadHiScore();
  this.cabinetPlays = loadInteger(CABINET_CONFIG.storage.plays);
  this.scoreCredits = loadInteger(CABINET_CONFIG.storage.scoreCredits);
  this.fireControlOwned = loadBoolean(CABINET_CONFIG.storage.fireControl);
  this.notice = "INSERT A QUARTER TO START";
  this.debug = { on: false, gunOff: false, timeScale: 1, invincible: false };
  this.reset();
  this.state = "title";
  this.syncCabinetUi();
  this.syncDebugUi();
}

Game.prototype.reset = function () {
  this.score = 0;
  this.lives = 3;
  this.wave = 1;
  this.state = "playing";
  this.transitionTimer = 0;
  this.fireCooldown = 0;
  this.enemyFireTimer = 1.2;
  this.playerBullet = null;
  this.enemyBullets = [];
  this.explosions = [];
  this.player = { x: W / 2 - 18, y: H - 44, w: 36, h: 16, speed: 260, invuln: 0 };
  this.ufo = null;
  this.ufoTimer = 15 + Math.random() * 10;
  stopUfoSound();
  this.spawnWave();
};

Game.prototype.addQuarter = function () {
  this.cabinetPlays++;
  saveInteger(CABINET_CONFIG.storage.plays, this.cabinetPlays);
  this.notice = "QUARTER ACCEPTED // PRESS ENTER";
  wakeAudio();
  playQuarter();
  this.syncCabinetUi();
};

Game.prototype.startFromCredit = function () {
  if (this.cabinetPlays < CABINET_CONFIG.quarterCost) {
    this.notice = "INSERT A QUARTER TO START";
    this.syncCabinetUi();
    return false;
  }
  this.cabinetPlays -= CABINET_CONFIG.quarterCost;
  saveInteger(CABINET_CONFIG.storage.plays, this.cabinetPlays);
  this.notice = "RUN ACTIVE // SCORE BECOMES CREDITS";
  this.reset();
  wakeAudio();
  playWaveJingle();
  this.syncCabinetUi();
  return true;
};

Game.prototype.awardScore = function (points) {
  var credits = Math.floor(points * CABINET_CONFIG.scoreCreditRate);
  this.score += points;
  this.scoreCredits += credits;
  saveInteger(CABINET_CONFIG.storage.scoreCredits, this.scoreCredits);
  this.recordHiScore();
  this.syncCabinetUi();
};

Game.prototype.buyFireControl = function () {
  var upgrade = CABINET_CONFIG.fireControl;
  if (this.fireControlOwned || this.scoreCredits < upgrade.cost) return false;
  this.scoreCredits -= upgrade.cost;
  this.fireControlOwned = true;
  saveInteger(CABINET_CONFIG.storage.scoreCredits, this.scoreCredits);
  saveBoolean(CABINET_CONFIG.storage.fireControl, true);
  this.notice = "FIRE CONTROL INSTALLED // +20% RATE";
  wakeAudio();
  playServiceInstall();
  this.syncCabinetUi();
  return true;
};

Game.prototype.currentFireCooldown = function () {
  return 0.35 * (this.fireControlOwned ? CABINET_CONFIG.fireControl.cooldownMultiplier : 1);
};

Game.prototype.toggleDebugMode = function () {
  this.debug.on = !this.debug.on;
  if (!this.debug.on) {
    this.debug.gunOff = false;
    this.debug.timeScale = 1;
    this.debug.invincible = false;
  }
  this.syncDebugUi();
};

Game.prototype.toggleDebugGun = function () {
  if (!this.debug.on) return;
  this.debug.gunOff = !this.debug.gunOff;
  this.syncDebugUi();
};

Game.prototype.toggleDebugSpeed = function () {
  if (!this.debug.on) return;
  this.debug.timeScale = this.debug.timeScale === 1 ? DEBUG_CONFIG.speedMultiplier : 1;
  this.syncDebugUi();
};

Game.prototype.toggleDebugInvincible = function () {
  if (!this.debug.on) return;
  this.debug.invincible = !this.debug.invincible;
  this.syncDebugUi();
};

Game.prototype.syncDebugUi = function () {
  debugToggleButton.textContent = "DEBUG: " + (this.debug.on ? "ON" : "OFF");
  debugPanel.hidden = !this.debug.on;
  debugGunButton.textContent = "GUN: " + (this.debug.gunOff ? "OFF" : "AUTO");
  debugSpeedButton.textContent = "SPEED: " + this.debug.timeScale + "X";
  debugInvButton.textContent = "INVINCIBLE: " + (this.debug.invincible ? "ON" : "OFF");
  var flags = [];
  if (this.debug.gunOff) flags.push("GUN OFF");
  if (this.debug.timeScale > 1) flags.push("SPEED X" + this.debug.timeScale);
  if (this.debug.invincible) flags.push("INVINCIBLE");
  debugReadoutNode.textContent = this.debug.on ? (flags.length ? "ACTIVE: " + flags.join(" / ") : "NO MODS ACTIVE") : "DEBUG OFF";
};

Game.prototype.syncCabinetUi = function () {
  var upgrade = CABINET_CONFIG.fireControl;
  cabinetPlaysNode.firstChild.nodeValue = "CREDIT " + ("0" + this.cabinetPlays).slice(-2);
  scoreCreditsNode.textContent = ("000000" + this.scoreCredits).slice(-6);
  if (this.fireControlOwned) {
    fireControlCard.hidden = false;
    buyFireControlButton.disabled = true;
    buyFireControlButton.textContent = "INSTALLED // 20% FASTER";
  } else {
    fireControlCard.hidden = this.scoreCredits < upgrade.cost;
    buyFireControlButton.disabled = this.scoreCredits < upgrade.cost;
    buyFireControlButton.textContent = "INSTALL // " + upgrade.cost + " " + CABINET_CONFIG.scoreCreditLabel;
  }
  cabinetStatusNode.innerHTML = '<span class="status-light"></span>' + this.notice;
};

Game.prototype.spawnWave = function () {
  this.invaders = [];
  var startY = 60 + Math.min(160, (this.wave - 1) * 16);
  var startX = (W - COLS * CELL_W) / 2;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      this.invaders.push({
        alive: true,
        row: r,
        x: startX + c * CELL_W + (CELL_W - INV_W) / 2,
        y: startY + r * CELL_H + (CELL_H - INV_H) / 2,
        w: INV_W,
        h: INV_H
      });
    }
  }
  this.total = this.invaders.length;
  this.alive = this.total;
  this.dir = 1;
  this.buildShields();
};

Game.prototype.buildShields = function () {
  this.shields = [];
  var cell = SHIELD_CELL;
  var shieldW = 8 * cell;
  var shieldH = 4 * cell;
  var gap = (W - 4 * shieldW) / 5;
  var y = H - 130;
  for (var s = 0; s < 4; s++) {
    var x = gap + s * (shieldW + gap);
    for (var gy = 0; gy < 4; gy++) {
      for (var gx = 0; gx < 8; gx++) {
        this.shields.push({ x: x + gx * cell, y: y + gy * cell, w: cell, h: cell });
      }
    }
  }
};

Game.prototype.marchSpeed = function () {
  var base = 40 + this.wave * 12;
  var killed = this.total - this.alive;
  return base * (1 + 1.4 * killed / this.total);
};

Game.prototype.overlap = function (a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
};

Game.prototype.advanceBulletY = function (bullet, dt) {
  var remaining = Math.abs(bullet.vy) * dt;
  var dir = bullet.vy < 0 ? -1 : 1;
  while (remaining > 0) {
    var step = Math.min(SHIELD_CELL, remaining);
    bullet.y += dir * step;
    remaining -= step;
    if (this.hitShield(bullet)) return true;
  }
  return false;
};

Game.prototype.spawnShipExplosion = function () {
  var p = this.player;
  var cx = p.x + p.w / 2;
  var cy = p.y + p.h / 2;
  for (var i = 0; i < SHIP_EXPLOSION_PARTICLES; i++) {
    var angle = (i / SHIP_EXPLOSION_PARTICLES) * Math.PI * 2;
    var speed = SHIP_EXPLOSION_SPEED * (0.5 + Math.random() * 0.5);
    this.explosions.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: SHIP_EXPLOSION_LIFE,
      maxLife: SHIP_EXPLOSION_LIFE,
      color: i % 2 ? "#d8ff4f" : "#ffbe58"
    });
  }
};

Game.prototype.updateExplosions = function (dt) {
  for (var i = this.explosions.length - 1; i >= 0; i--) {
    var e = this.explosions[i];
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.life -= dt;
    if (e.life <= 0) this.explosions.splice(i, 1);
  }
};

Game.prototype.drawExplosions = function (c) {
  for (var i = 0; i < this.explosions.length; i++) {
    var ex = this.explosions[i];
    var frac = ex.life / ex.maxLife;
    var size = 2 + Math.round(3 * frac);
    c.fillStyle = ex.color;
    c.fillRect(ex.x - size / 2, ex.y - size / 2, size, size);
  }
};

Game.prototype.destroyPlayer = function () {
  this.spawnShipExplosion();
  playPlayerExplosion();
  this.gameOver();
};

Game.prototype.gameOver = function () {
  this.state = "gameover";
  if (this.score > this.hiScore) this.hiScore = this.score;
  saveHiScore(this.hiScore);
  stopUfoSound();
  playGameOver();
  this.notice = "RUN ENDED // ADD QUARTER TO PLAY AGAIN";
  this.syncCabinetUi();
};

Game.prototype.recordHiScore = function () {
  if (this.score > this.hiScore) {
    this.hiScore = this.score;
    saveHiScore(this.hiScore);
  }
};

Game.prototype.update = function (dt) {
  this.updateExplosions(dt);
  if (this.state === "title" || this.state === "gameover") {
    if (this.input.enter) {
      this.input.enter = false;
      this.startFromCredit();
    }
    return;
  }
  if (this.state === "waveTransition") {
    this.transitionTimer -= dt;
    if (this.transitionTimer <= 0) {
      this.wave++;
      this.spawnWave();
      this.state = "playing";
      playWaveJingle();
    }
    return;
  }

  var p = this.player;
  p.invuln = Math.max(0, p.invuln - dt);
  if (this.input.left) p.x -= p.speed * dt;
  if (this.input.right) p.x += p.speed * dt;
  if (this.input.touchTarget !== null) {
    var tcx = p.x + p.w / 2;
    if (this.input.touchTarget < tcx - 2) p.x -= p.speed * dt;
    else if (this.input.touchTarget > tcx + 2) p.x += p.speed * dt;
  }
  p.x = Math.max(MARGIN, Math.min(W - MARGIN - p.w, p.x));

  this.fireCooldown -= dt;
  if (this.playerBullet === null && this.fireCooldown <= 0 && !this.debug.gunOff) {
    this.playerBullet = { x: p.x + p.w / 2 - 1, y: p.y, w: 2, h: 8, vy: -420 };
    this.fireCooldown = this.currentFireCooldown();
    playFire();
  }

  var speed = this.marchSpeed() * dt;
  var minX = W, maxX = 0;
  var i, inv;
  for (i = 0; i < this.invaders.length; i++) {
    inv = this.invaders[i];
    if (!inv.alive) continue;
    if (inv.x < minX) minX = inv.x;
    if (inv.x + inv.w > maxX) maxX = inv.x + inv.w;
  }
  if (this.alive > 0 && ((maxX + speed > W - MARGIN && this.dir > 0) || (minX - speed < MARGIN && this.dir < 0))) {
    this.dir = -this.dir;
    for (i = 0; i < this.invaders.length; i++) {
      if (this.invaders[i].alive) this.invaders[i].y += DROP;
    }
  } else {
    for (i = 0; i < this.invaders.length; i++) {
      if (this.invaders[i].alive) this.invaders[i].x += this.dir * speed;
    }
  }

  this.ufoTimer -= dt;
  if (this.ufo === null) {
    if (this.ufoTimer <= 0) {
      this.ufo = { x: -UFO_W, y: UFO_Y, w: UFO_W, h: UFO_H, dir: 1, speed: UFO_SPEED, points: UFO_POINTS[Math.floor(Math.random() * UFO_POINTS.length)] };
      this.ufoTimer = 15 + Math.random() * 10;
      playUfoSpawn();
    }
  } else {
    this.ufo.x += this.ufo.dir * this.ufo.speed * dt;
    if (this.ufo.x > W) this.ufo = null;
  }
  if (this.ufo) updateUfoSound(this.ufo); else stopUfoSound();

  this.enemyFireTimer -= dt;
  if (this.enemyFireTimer <= 0 && this.enemyBullets.length < 3 && this.alive > 0) {
    var aliveList = [];
    for (var si = 0; si < this.invaders.length; si++) {
      if (this.invaders[si].alive) aliveList.push(this.invaders[si]);
    }
    var shooter = aliveList.length > 0 ? aliveList[Math.floor(Math.random() * aliveList.length)] : null;
    if (shooter) {
      this.enemyBullets.push({ x: shooter.x + shooter.w / 2 - 1, y: shooter.y + shooter.h, w: 3, h: 8, vy: 170 + this.wave * 20 });
    }
    var rate = Math.max(0.25, 0.9 - this.wave * 0.08) * (0.5 + Math.random());
    this.enemyFireTimer = rate;
  }

  var j, eb;
  for (j = this.enemyBullets.length - 1; j >= 0; j--) {
    eb = this.enemyBullets[j];
    if (this.advanceBulletY(eb, dt)) { this.enemyBullets.splice(j, 1); continue; }
    if (eb.y > H) { this.enemyBullets.splice(j, 1); continue; }
    if (this.playerBullet && this.overlap(eb, this.playerBullet)) {
      this.playerBullet = null;
      this.enemyBullets.splice(j, 1);
      continue;
    }
    if (p.invuln <= 0 && this.overlap(eb, p)) {
      this.enemyBullets.splice(j, 1);
      if (this.debug.invincible) continue;
      this.lives--;
      if (this.lives > 0) playDeath();
      p.invuln = 1.5;
      if (this.lives <= 0) { this.gameOver(); return; }
      continue;
    }
  }

  if (this.playerBullet) {
    var b = this.playerBullet;
    if (this.advanceBulletY(b, dt)) { this.playerBullet = null; }
    else if (b.y + b.h < 0) { this.playerBullet = null; }
    else if (this.ufo && this.overlap(b, this.ufo)) {
      this.awardScore(this.ufo.points);
      stopUfoSound();
      playUfoHit();
      this.ufo = null;
      this.playerBullet = null;
    }
    else {
      for (i = 0; i < this.invaders.length; i++) {
        inv = this.invaders[i];
        if (inv.alive && this.overlap(b, inv)) {
          inv.alive = false;
          this.alive--;
          this.awardScore(ROW_POINTS[inv.row]);
          playExplosion();
          this.playerBullet = null;
          break;
        }
      }
    }
  }

  var floorLine = H - GAME_OVER_FLOOR_MARGIN;
  for (i = 0; i < this.invaders.length; i++) {
    inv = this.invaders[i];
    if (!inv.alive) continue;
    if (this.overlap(inv, p) && !this.debug.invincible) { this.destroyPlayer(); return; }
    if (inv.y + inv.h >= floorLine) { this.gameOver(); return; }
    for (j = this.shields.length - 1; j >= 0; j--) {
      if (this.overlap(inv, this.shields[j])) this.shields.splice(j, 1);
    }
  }

  if (this.alive <= 0) {
    this.state = "waveTransition";
    this.transitionTimer = 2;
    this.playerBullet = null;
    this.enemyBullets = [];
  }
};

Game.prototype.hitShield = function (bullet) {
  for (var j = 0; j < this.shields.length; j++) {
    if (this.overlap(bullet, this.shields[j])) {
      this.shields.splice(j, 1);
      return true;
    }
  }
  return false;
};

Game.prototype.render = function () {
  var c = this.ctx;
  c.fillStyle = "#000000";
  c.fillRect(0, 0, W, H);

  if (this.state === "title") {
    this.text(c, "SPACE INVADERS", W / 2, 200, "48px monospace", "#4fd8ff");
    this.text(c, "HI-SCORE: " + this.hiScore, W / 2, 250, "20px monospace", "#d8ff4f");
    this.text(c, this.cabinetPlays ? "PRESS ENTER TO START" : "ADD QUARTER TO START", W / 2, 300, "20px monospace", "#ffffff");
    this.text(c, "CABINET CREDIT: " + this.cabinetPlays, W / 2, 330, "16px monospace", "#ffbe58");
    this.text(c, "Move: Arrows / A-D / Touch", W / 2, 360, "16px monospace", "#9a9a9a");
    this.text(c, "Fire: Automatic", W / 2, 400, "16px monospace", "#9a9a9a");
    this.text(c, "M: Mute", W / 2, 440, "16px monospace", "#9a9a9a");
    this.text(c, "v" + VERSION, W / 2, 480, "16px monospace", "#9a9a9a");
    return;
  }
  if (this.state === "gameover") {
    this.text(c, "GAME OVER", W / 2, 220, "48px monospace", "#ff4f4f");
    this.text(c, "HI-SCORE: " + this.hiScore, W / 2, 260, "20px monospace", "#d8ff4f");
    this.text(c, "Score: " + this.score, W / 2, 300, "20px monospace", "#ffffff");
    this.text(c, this.cabinetPlays ? "PRESS ENTER TO RESTART" : "ADD QUARTER TO RESTART", W / 2, 360, "20px monospace", "#9a9a9a");
    this.text(c, "v" + VERSION, W / 2, 420, "16px monospace", "#9a9a9a");
    this.drawExplosions(c);
    return;
  }

  var i, s, inv;
  for (i = 0; i < this.shields.length; i++) {
    s = this.shields[i];
    c.fillStyle = SHIELD_COLOR;
    c.fillRect(s.x, s.y, s.w, s.h);
  }
  for (i = 0; i < this.invaders.length; i++) {
    inv = this.invaders[i];
    if (!inv.alive) continue;
    c.fillStyle = ROW_COLORS[inv.row];
    c.fillRect(inv.x, inv.y, inv.w, inv.h);
    c.fillStyle = "#000000";
    c.fillRect(inv.x + 4, inv.y + 4, 4, 4);
    c.fillRect(inv.x + inv.w - 8, inv.y + 4, 4, 4);
  }

  if (this.ufo) {
    var u = this.ufo;
    c.fillStyle = "#ff7f7f";
    c.fillRect(u.x, u.y + 4, u.w, u.h - 4);
    c.fillRect(u.x + 7, u.y, 10, 4);
    c.fillStyle = "#ffffff";
    c.fillRect(u.x + 3, u.y + 6, 2, 2);
    c.fillRect(u.x + u.w - 5, u.y + 6, 2, 2);
  }

  var p = this.player;
  if (!(p.invuln > 0 && Math.floor(p.invuln * 8) % 2 === 0)) {
    c.fillStyle = "#d8ff4f";
    c.fillRect(p.x, p.y + 6, p.w, p.h - 6);
    c.fillRect(p.x + p.w / 2 - 3, p.y, 6, 6);
  }
  this.drawExplosions(c);

  c.fillStyle = "#ffffff";
  if (this.playerBullet) c.fillRect(this.playerBullet.x, this.playerBullet.y, this.playerBullet.w, this.playerBullet.h);
  for (i = 0; i < this.enemyBullets.length; i++) {
    var eb = this.enemyBullets[i];
    c.fillRect(eb.x, eb.y, eb.w, eb.h);
  }

  this.text(c, "SCORE " + this.score, 12, 20, "16px monospace", "#ffffff", "left");
  this.text(c, "CR " + this.scoreCredits, W / 2, 20, "14px monospace", "#58eeff");
  this.text(c, "WAVE " + this.wave, W - 12, 20, "16px monospace", "#9a9a9a", "right");
  for (i = 0; i < this.lives; i++) {
    c.fillStyle = "#d8ff4f";
    c.fillRect(12 + i * 26, H - 16, 18, 8);
  }
  this.text(c, muted ? "SOUND: OFF" : "SOUND: ON", W - 12, H - 12, "12px monospace", "#9a9a9a", "right");
  if (this.debug.on) {
    c.fillStyle = "#ff4fd8";
    c.fillRect(0, H - GAME_OVER_FLOOR_MARGIN, W, 1);
    this.text(c, "DEBUG" + (this.debug.gunOff ? " GUN-OFF" : "") + (this.debug.timeScale > 1 ? " SPEED-X" + this.debug.timeScale : "") + (this.debug.invincible ? " INVINCIBLE" : ""), W / 2, 34, "12px monospace", "#dcff69");
  }
  if (this.state === "waveTransition") {
    this.text(c, "WAVE " + (this.wave + 1) + " INCOMING", W / 2, 300, "24px monospace", "#4fd8ff");
  }
};

Game.prototype.text = function (c, str, x, y, font, color, align) {
  c.font = font;
  c.fillStyle = color;
  c.textAlign = align || "center";
  c.fillText(str, x, y);
  c.textAlign = "left";
};

var game = new Game(canvas);
initAudio();

addQuarterButton.addEventListener("click", function () {
  game.addQuarter();
});
buyFireControlButton.addEventListener("click", function () {
  game.buyFireControl();
});
debugToggleButton.addEventListener("click", function () {
  game.toggleDebugMode();
});
debugGunButton.addEventListener("click", function () {
  game.toggleDebugGun();
});
debugSpeedButton.addEventListener("click", function () {
  game.toggleDebugSpeed();
});
debugInvButton.addEventListener("click", function () {
  game.toggleDebugInvincible();
});

window.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  wakeAudio();
  var k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") game.input.left = true;
  else if (k === "ArrowRight" || k === "d" || k === "D") game.input.right = true;
  else if (k === "Enter") game.input.enter = true;
  else if ((k === "m" || k === "M") && !e.repeat) toggleMute();
});
window.addEventListener("keyup", function (e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  var k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") game.input.left = false;
  else if (k === "ArrowRight" || k === "d" || k === "D") game.input.right = false;
  else if (k === "Enter") game.input.enter = false;
});

game.input.touchTarget = null;
var touchDown = false;
canvas.addEventListener("pointerdown", function (e) {
  if (e.pointerType === "mouse") return;
  wakeAudio();
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  touchDown = true;
  game.input.touchTarget = (e.clientX - rect.left) * (W / rect.width);
  if (game.state === "title" || game.state === "gameover") game.input.enter = true;
});
canvas.addEventListener("pointermove", function (e) {
  if (e.pointerType === "mouse") return;
  if (!touchDown) return;
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  game.input.touchTarget = (e.clientX - rect.left) * (W / rect.width);
});
function endTouch(e) {
  if (e.pointerType === "mouse") return;
  touchDown = false;
  game.input.touchTarget = null;
  game.input.enter = false;
}
canvas.addEventListener("pointerup", endTouch);
canvas.addEventListener("pointercancel", endTouch);

var lastTime = performance.now();
function frame() {
  var now = performance.now();
  var dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  game.update(dt * game.debug.timeScale);
  game.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
